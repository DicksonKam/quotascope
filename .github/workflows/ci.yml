name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:slow
      - run: npm run release:prepare
      - if: runner.os == 'macOS'
        run: npm run test:macos
      - if: runner.os == 'macOS'
        run: npm run menubar -- build
